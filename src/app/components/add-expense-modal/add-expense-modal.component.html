<ion-modal [isOpen]="isModalOpen()" (willDismiss)="onWillDismiss($event)" [initialBreakpoint]="1"
	[breakpoints]="[0, 1]">
	<ng-template>
		<ion-content class="ion-padding">
			<ion-item lines="none">
				<ion-input type="text" [clearOnEdit]="true" label="With you and:" [(ngModel)]="name"
					(ngModelChange)="name.set($event)"></ion-input>
			</ion-item>

			<!-- <ion-list>
				@for (item of selectedList; track $index) {
				<ion-item lines="none">
					{{item}}
				</ion-item>
				}
			</ion-list> -->

			<ion-card
				class="ion-display-flex ion-justify-content-center ion-align-items-center ion-margin-top ion-padding">
				<div class="expense-form">
					<ion-input type="text" placeholder="Enter a description">
						<div slot="label"><ion-icon name="document-text-outline" size="large"></ion-icon></div>
					</ion-input>
					<ion-input type="number" placeholder="0.00">
						<div slot="label"><ion-icon name="cash-outline" size="large"></ion-icon></div>
					</ion-input>
				</div>
			</ion-card>
		</ion-content>
	</ng-template>
</ion-modal>
