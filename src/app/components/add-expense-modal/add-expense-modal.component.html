<ion-modal [isOpen]="isModalOpen()" (willDismiss)="onWillDismiss($event)" [initialBreakpoint]="1"
	[breakpoints]="[0, 1]">
	<ng-template>
		<ion-content class="ion-padding">
			<div class="modal-content">
				<!-- Search Section -->
				<ion-searchbar [(ngModel)]="searchQuery" (ionInput)="handleSearch($event)"
					placeholder="Add people to split with">
				</ion-searchbar>

				<!-- Selected Entities as Pills -->
				<div class="selected-pills">
					@for (entity of selectedList; track $index) {
					@if (entity && entity.trim() !== '') {
					<div class="pill">
						<span>{{entity}}</span>
						<ion-icon name="close-circle-outline" (click)="removeEntity(entity)"></ion-icon>
					</div>
					}
					}
				</div>

				<!-- Search Results -->
				@if (searchResults().length > 0) {
				<ion-list>
					@for (result of searchResults(); track $index) {
					<ion-item (click)="addEntity(result)" button>
						<ion-label>{{result}}</ion-label>
					</ion-item>
					}
				</ion-list>
				}

				<!-- Expense Form -->
				<ion-card class="ion-padding">
					<div class="expense-form">
						<ion-input type="text" placeholder="Enter a description" [(ngModel)]="description"
							(ngModelChange)="description.set($event)">
							<div slot="label"><ion-icon name="document-text-outline" size="large"></ion-icon></div>
						</ion-input>
						<ion-input type="number" placeholder="0.00" [(ngModel)]="amount">
							<div slot="label"><ion-icon name="cash-outline" size="large"></ion-icon></div>
						</ion-input>
					</div>
				</ion-card>
				<ion-button class="generic-button" (click)="saveExpense()">
					<ion-icon name="checkmark-outline" slot="start"></ion-icon>
					Save Expense
				</ion-button>
			</div>
		</ion-content>
	</ng-template>
</ion-modal>
