<ion-modal [isOpen]="true" (willDismiss)="onWillDismiss($event)" [initialBreakpoint]="1" [breakpoints]="[0, 1]">
	<ng-template>
		<ion-content class="ion-padding">
			<ion-item lines="none">
				<ion-input type="text" label="With you and:" [(ngModel)]="name"></ion-input>
			</ion-item>
		</ion-content>
	</ng-template>
</ion-modal>
