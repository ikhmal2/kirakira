<ion-card class="ion-justify-content-between ion-flex-row ion-margin-top">
	@if (checkRoute() === 'Save') {
	<ion-item (click)="navigateToGroup()" lines="none"><ion-icon name="close-outline"></ion-icon></ion-item>
	<ion-item lines="none">
		<ion-text>Add an expense</ion-text>
	</ion-item>
	} @else {
	<ion-item lines="none"><ion-icon name="search-outline"></ion-icon></ion-item>
	}
	<ion-item lines="none">{{checkRoute()}}</ion-item>
</ion-card>
